  <circle cx="378" cy="33" r="4" fill="#4fd1c5"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle><text x="388" y="37.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace" font-size="12" fill="#4fd1c5">live</text>
  <text x="23" y="78" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="-0.4" fill="#eef2f6">DriveSafe</text>
  <text x="24" y="104" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#b6c2cf">Spots driver fatigue in real time from 468 face</text>
  <text x="24" y="125" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" fill="#b6c2cf">landmarks, then escalates: an alarm, an SMS, an</text>
